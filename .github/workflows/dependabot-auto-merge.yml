name: Dependabot Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: crabpot-dependabot-automerge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-automerge:
    name: Validate fixtures and merge
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      merged-sha: ${{ steps.merge.outputs.merged-sha }}
    steps:
      - name: Checkout Dependabot branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          token: ${{ github.token }}
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            plugins/**/package-lock.json

      - name: Install Crabpot dependencies
        run: npm install --no-package-lock

      - name: Resolve pinned OpenClaw Default Track
        id: openclaw-track
        run: node scripts/openclaw-pin.mjs --github-output

      - name: Checkout OpenClaw
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.openclaw-track.outputs.ref }}
          path: openclaw

      - name: Fetch main dashboard baseline
        if: ${{ github.event.pull_request.base.ref != 'main' }}
        run: |
          mkdir -p .crabpot/baseline
          git fetch --no-tags --depth=1 origin main
          git show origin/main:reports/crabpot-dashboard-data.json > .crabpot/baseline/main-dashboard-data.json || true

      - name: Verify Dependabot changed only fixture pins and generated reports
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' > /tmp/crabpot-dependabot-files.txt
          if [ ! -s /tmp/crabpot-dependabot-files.txt ]; then
            echo "::error::Dependabot PR has no changed files"
            exit 1
          fi
          while IFS= read -r file; do
            if [[ "$file" == ".gitmodules" || "$file" == "README.md" || "$file" =~ ^reports/ || "$file" =~ ^plugins/[^/]+$ || "$file" =~ ^plugins/[^/]+/package(-lock)?\.json$ ]]; then
              continue
            fi
            echo "::error file=${file}::Dependabot auto-merge only accepts fixture pin changes and generated report updates"
            exit 1
          done < /tmp/crabpot-dependabot-files.txt

      - name: Install OpenClaw lifecycle dependencies
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./openclaw/package.json').packageManager.split('+')[0]")" --activate
          pnpm --dir openclaw install --frozen-lockfile --ignore-scripts

      - name: Test fixture pin updates
        env:
          CRABPOT_TEST_OPENCLAW_PATH: ./openclaw
        run: npm test

      - name: Validate fixture compatibility
        env:
          CRABPOT_FIXTURE_SET: ${{ steps.openclaw-track.outputs.track == 'development' && 'openclaw-beta' || '' }}
          CRABPOT_PLUGIN_TRACK: ${{ steps.openclaw-track.outputs.track == 'development' && 'source-pack' || steps.openclaw-track.outputs.track }}
        run: |
          node scripts/sync-fixtures.mjs --materialize --openclaw ./openclaw
          node scripts/sync-fixtures.mjs --check
          node scripts/run-contract-smoke.mjs --strict --openclaw ./openclaw
          node scripts/inspect-fixtures.mjs --check

      - name: Merge Dependabot PR
        id: merge
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            state="$(gh pr view "${PR_NUMBER}" --json headRefOid,mergeable,mergeStateStatus,statusCheckRollup --jq '
              [
                .headRefOid,
                .mergeable,
                .mergeStateStatus,
                ([.statusCheckRollup[]?
                  | select((.workflowName // "") != "Dependabot Auto Merge")
                  | select((.status // .state // "") == "IN_PROGRESS" or (.status // .state // "") == "QUEUED" or (.status // .state // "") == "PENDING" or (.status // .state // "") == "EXPECTED")
                ] | length),
                ([.statusCheckRollup[]?
                  | select((.workflowName // "") != "Dependabot Auto Merge")
                  | select((.conclusion // .state // "") == "FAILURE" or (.conclusion // .state // "") == "ERROR" or (.conclusion // .state // "") == "TIMED_OUT" or (.conclusion // .state // "") == "ACTION_REQUIRED" or (.conclusion // .state // "") == "CANCELLED")
                ] | length)
              ] | @tsv
            ')"
            read -r current_head mergeable merge_state pending_checks failed_checks <<< "${state}"
            if [ "${current_head}" != "${PR_HEAD_SHA}" ]; then
              echo "PR ${PR_NUMBER} moved; its newer workflow owns validation and merge"
              exit 0
            fi
            if [ "${failed_checks}" != "0" ]; then
              echo "::error::PR ${PR_NUMBER} has ${failed_checks} failed status check(s); refusing auto-merge"
              gh pr view "${PR_NUMBER}" --json url,mergeable,mergeStateStatus,statusCheckRollup
              exit 1
            fi
            if [ "${mergeable}" = "MERGEABLE" ] && [ "${pending_checks}" = "0" ]; then
              gh pr merge "${PR_NUMBER}" --squash --delete-branch --match-head-commit "${PR_HEAD_SHA}"
              merge_sha="$(gh pr view "${PR_NUMBER}" --json mergeCommit --jq .mergeCommit.oid)"
              if ! [[ "${merge_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Merged PR ${PR_NUMBER} has no confirmed commit; refusing report publication"
                exit 1
              fi
              echo "merged-sha=${merge_sha}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "PR ${PR_NUMBER} mergeable=${mergeable} mergeStateStatus=${merge_state} pendingChecks=${pending_checks}; waiting for mergeability and green checks (${attempt}/18)"
            sleep 10
          done
          gh pr view "${PR_NUMBER}" --json url,mergeable,mergeStateStatus,statusCheckRollup
          exit 1

  dashboard:
    needs: refresh-and-automerge
    if: ${{ needs.refresh-and-automerge.outputs.merged-sha != '' }}
    permissions:
      contents: write
      statuses: write
    uses: ./.github/workflows/publish-dashboard.yml
    with:
      source-sha: ${{ needs.refresh-and-automerge.outputs.merged-sha }}
      target-branch: ${{ github.event.pull_request.base.ref }}
