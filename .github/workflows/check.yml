name: Check

on:
  # Keep these events path-unfiltered. Plugin submodule gitlink bumps under
  # plugins/** must retest on Dependabot PRs and again after merge to main.
  pull_request:
  push:
    branches: [main, crab-beta, crab-development]

# PR runs supersede each other; other event attempts remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fixture-security:
    name: Fixture lock security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Resolve fixture security scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          head="${HEAD_SHA}"
          if [ -z "${base}" ] || [[ "${base}" =~ ^0+$ ]]; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${base}" "${head}"
          audit=false
          while IFS= read -r changed_path; do
            if [[ "${changed_path}" =~ ^plugins/[^/]+/package(-lock)?\.json$ ]] ||
              [ "${changed_path}" = "scripts/check-fixture-security.mjs" ] ||
              [ "${changed_path}" = "package.json" ]; then
              audit=true
            fi
          done < <(git diff --name-only "${base}" "${head}" --)
          echo "audit=${audit}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: ${{ steps.scope.outputs.audit == 'true' }}
        with:
          node-version: 22.23.4
      - name: Audit fixture locks
        if: ${{ steps.scope.outputs.audit == 'true' }}
        run: npm run check:fixture-security
      - name: Skip unchanged fixture locks
        if: ${{ steps.scope.outputs.audit != 'true' }}
        run: echo "No fixture lock or security-checker changes; scheduled audit owns drift detection."

  manifest:
    name: Default Track / Static checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            plugins/**/package-lock.json
      - name: Resolve pinned OpenClaw Default Track
        id: openclaw-track
        run: node scripts/openclaw-pin.mjs --github-output
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.openclaw-track.outputs.ref }}
          path: openclaw
      - id: suite
        shell: bash
        # Leave time for Inspector smoke and artifacts after the full-corpus suite.
        timeout-minutes: 225
        run: |
          plugin_track="${{ steps.openclaw-track.outputs.track }}"
          extra_args=(--openclaw-track "${{ steps.openclaw-track.outputs.track }}" --plugin-track "${plugin_track}")
          if [ "${{ steps.openclaw-track.outputs.track }}" = "development" ]; then
            extra_args=(--openclaw-track "${{ steps.openclaw-track.outputs.track }}" --fixture-set openclaw-beta --plugin-track source-pack)
          fi
          node scripts/run-static-suite.mjs --write-reports --openclaw ./openclaw --policy dashboard --profile-runs 3 --plugin-inspector-smoke "${extra_args[@]}"
      - name: Smoke source, packed, and published Plugin Inspector
        id: inspector-smoke
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        # Three complete artifact inspections retain individual 600s limits.
        timeout-minutes: 40
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          CRABPOT_FIXTURE_SET: ${{ steps.openclaw-track.outputs.track == 'development' && 'openclaw-beta' || '' }}
          CRABPOT_OPENCLAW_TRACK: ${{ steps.openclaw-track.outputs.track }}
          CRABPOT_PLUGIN_TRACK: ${{ steps.openclaw-track.outputs.track == 'development' && 'source-pack' || steps.openclaw-track.outputs.track }}
        run: |
          set -euo pipefail
          inspector_root="$(node --input-type=module -e 'import path from "node:path"; import { resolvePluginInspectorCliPath } from "./scripts/plugin-inspector-source.mjs"; process.stdout.write(path.dirname(path.dirname(resolvePluginInspectorCliPath())));')"
          CRABPOT_PLUGIN_INSPECTOR_CLI=source CRABPOT_PLUGIN_INSPECTOR_DIR="$inspector_root" node scripts/run-plugin-inspector-smoke.mjs --check --runtime --resources --retirements --out reports/plugin-inspector-source-smoke
          packed_root="$(mktemp -d "${RUNNER_TEMP}/plugin-inspector-smoke.XXXXXX")"
          trap 'rm -rf "$packed_root"' EXIT
          npm pack "$inspector_root" --ignore-scripts --pack-destination "$packed_root" --json > "$packed_root/pack.json"
          tarball="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync(process.argv[1], "utf8"))[0].filename);' "$packed_root/pack.json")"
          npm install --prefix "$packed_root/install" --ignore-scripts --no-audit --no-fund "$packed_root/$tarball"
          CRABPOT_PLUGIN_INSPECTOR_BIN="$packed_root/install/node_modules/.bin/plugin-inspector" CRABPOT_PLUGIN_INSPECTOR_DIR="$packed_root/install/node_modules/@openclaw/plugin-inspector" node scripts/run-plugin-inspector-smoke.mjs --check --runtime --resources --retirements --out reports/plugin-inspector-packed-smoke
          inspector_package="$(node --input-type=module -e 'import { pluginInspectorPackage } from "./scripts/plugin-inspector-source.mjs"; process.stdout.write(pluginInspectorPackage);')"
          npm install --prefix "$packed_root/published" --ignore-scripts --no-audit --no-fund "$inspector_package"
          CRABPOT_PLUGIN_INSPECTOR_BIN="$packed_root/published/node_modules/.bin/plugin-inspector" CRABPOT_PLUGIN_INSPECTOR_DIR="$packed_root/published/node_modules/@openclaw/plugin-inspector" node scripts/run-plugin-inspector-smoke.mjs --check --runtime --resources --retirements --out reports/plugin-inspector-published-smoke
      - name: Compare current runtime profile
        id: comparison
        if: ${{ !cancelled() && steps.suite.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          node scripts/ci-report-handoff.mjs run comparison node scripts/compare-runtime-profile.mjs
      - name: Write CI summary artifacts
        if: always()
        continue-on-error: true
        env:
          CRABPOT_CI_STEP_OUTCOMES: >-
            {"suite": ${{ toJSON(steps.suite) }},
             "comparison": ${{ toJSON(steps.comparison) }},
             "inspector-smoke": ${{ matrix.os == 'ubuntu-latest' && toJSON(steps.inspector-smoke) || '{"outcome":"not-selected"}' }}}
        run: node scripts/write-ci-summary.mjs --run-report --mode check --openclaw-label "${{ steps.openclaw-track.outputs.label }}" --github-step-summary
      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crabpot-default-track-reports-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn

  container-smoke:
    name: Default Track / Container static checks
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: node:24.22.1-bookworm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Resolve pinned OpenClaw Default Track
        id: openclaw-track
        run: node scripts/openclaw-pin.mjs --github-output
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.openclaw-track.outputs.ref }}
          path: openclaw
      - run: node --version
      - shell: bash
        timeout-minutes: 225
        run: |
          plugin_track="${{ steps.openclaw-track.outputs.track }}"
          extra_args=(--openclaw-track "${{ steps.openclaw-track.outputs.track }}" --plugin-track "${plugin_track}")
          if [ "${{ steps.openclaw-track.outputs.track }}" = "development" ]; then
            extra_args=(--openclaw-track "${{ steps.openclaw-track.outputs.track }}" --fixture-set openclaw-beta --plugin-track source-pack)
          fi
          node scripts/run-static-suite.mjs --openclaw ./openclaw --policy dashboard --profile-runs 3 --plugin-inspector-smoke "${extra_args[@]}"

  changed-fixture-plan:
    name: Default Track / Resolve changed fixture matrix
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      fixtures: ${{ steps.resolve.outputs.fixtures }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            plugins/**/package-lock.json
      - name: Resolve pinned OpenClaw Default Track
        id: openclaw-track
        run: node scripts/openclaw-pin.mjs --github-output
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.openclaw-track.outputs.ref }}
          path: openclaw
      - name: Resolve diff refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          fi
          refs=()
          if [ -n "$base" ]; then refs+=("$base"); fi
          if [ -n "$head" ]; then refs+=("$head"); fi
          if [ "${#refs[@]}" -gt 0 ]; then
            git fetch --no-tags --depth=1 origin "${refs[@]}"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
      - name: Resolve changed fixture matrix
        id: resolve
        shell: bash
        run: |
          node scripts/resolve-fixture-set.mjs \
            --fixture-set changed-submodules \
            --base-ref "${{ steps.refs.outputs.base }}" \
            --head-ref "${{ steps.refs.outputs.head }}" \
            --openclaw ./openclaw \
            --allow-empty \
            --github-output >> "$GITHUB_OUTPUT"
      - name: Show selected fixtures
        run: echo "fixtures=${{ steps.resolve.outputs.fixtures }}"

  changed-isolated-fixture:
    name: Default Track / Isolated changed fixture ${{ matrix.id }}
    runs-on: ubuntu-latest
    needs: changed-fixture-plan
    if: ${{ needs.changed-fixture-plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changed-fixture-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            plugins/**/package-lock.json
      - name: Resolve pinned OpenClaw Default Track
        id: openclaw-track
        run: node scripts/openclaw-pin.mjs --github-output
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.openclaw-track.outputs.ref }}
          path: openclaw
      - run: node scripts/ci-report-handoff.mjs start workspace execute execution compatibility policy
      - name: Materialize fixture payload
        env:
          CRABPOT_FIXTURE_SET: ${{ matrix.id }}
          CRABPOT_PLUGIN_TRACK: ${{ steps.openclaw-track.outputs.track == 'development' && 'source-pack' || steps.openclaw-track.outputs.track }}
        run: node scripts/sync-fixtures.mjs --materialize --openclaw ./openclaw
      - name: Validate workspace plan
        id: workspace
        shell: bash
        run: |
          node scripts/ci-report-handoff.mjs run workspace node scripts/workspace-plan.mjs --check --write --openclaw ./openclaw
      - name: Execute fixture lane
        id: execute
        continue-on-error: true
        env:
          CRABPOT_EXECUTE_ISOLATED: "1"
        shell: bash
        run: |
          node scripts/ci-report-handoff.mjs run execute npm run workspace:execute -- --fixture "${{ matrix.id }}" --allow-empty --openclaw ./openclaw
      - name: Summarize execution artifacts
        id: execution
        if: ${{ !cancelled() && (steps.execute.outcome == 'success' || steps.execute.outcome == 'failure') }}
        continue-on-error: true
        shell: bash
        run: |
          node scripts/ci-report-handoff.mjs run execution npm run execution:report
      - name: Reconcile compatibility report with runtime evidence
        id: compatibility
        if: ${{ !cancelled() && steps.execution.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          node scripts/ci-report-handoff.mjs run compatibility node scripts/generate-report.mjs --openclaw ./openclaw --execution-results reports/crabpot-execution-results.json --fixture-set "${{ matrix.id }}"
      - name: Run execution policy
        id: policy
        if: ${{ !cancelled() && steps.compatibility.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          node scripts/ci-report-handoff.mjs run policy node scripts/check-ci-policy.mjs --run-report
      - name: Write isolated summary
        if: always()
        continue-on-error: true
        env:
          CRABPOT_CI_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: node scripts/write-ci-summary.mjs --run-report --mode changed-isolated --openclaw-label "${{ steps.openclaw-track.outputs.label }}" --github-step-summary
      - name: Upload isolated execution artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crabpot-changed-isolated-${{ matrix.id }}
          path: |
            .crabpot/results/
            reports/crabpot-report.*
            reports/crabpot-issues.*
            reports/crabpot-execution-results.*
            reports/crabpot-ci-policy.*
            reports/crabpot-ci-summary.*
            reports/crabpot-ci-run.json
            reports/crabpot-workspace-plan.*
          if-no-files-found: warn
      - name: Fail if isolated policy failed
        if: ${{ !cancelled() && steps.policy.outcome != 'success' }}
        run: exit 1

  default-track:
    name: Default Track (pinned OpenClaw)
    runs-on: ubuntu-latest
    needs: [fixture-security, manifest, container-smoke, changed-fixture-plan, changed-isolated-fixture]
    if: always()
    steps:
      - name: Require every pinned lane
        env:
          FIXTURE_SECURITY_RESULT: ${{ needs.fixture-security.result }}
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
          PLAN_RESULT: ${{ needs.changed-fixture-plan.result }}
          ISOLATED_RESULT: ${{ needs.changed-isolated-fixture.result }}
        shell: bash
        run: |
          test "${FIXTURE_SECURITY_RESULT}" = success
          test "${MANIFEST_RESULT}" = success
          test "${CONTAINER_RESULT}" = success
          if [ "${PLAN_RESULT}" != success ] && [ "${PLAN_RESULT}" != skipped ]; then
            exit 1
          fi
          if [ "${ISOLATED_RESULT}" != success ] && [ "${ISOLATED_RESULT}" != skipped ]; then
            exit 1
          fi

  dashboard:
    needs: [default-track]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.actor != 'github-actions[bot]' && needs.default-track.result == 'success' }}
    permissions:
      contents: write
      statuses: write
    uses: ./.github/workflows/publish-dashboard.yml
    with:
      source-sha: ${{ github.sha }}
      target-branch: ${{ github.ref_name }}
