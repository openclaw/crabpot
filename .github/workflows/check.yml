name: Check

on:
  # Keep these events path-unfiltered. Plugin submodule gitlink bumps under
  # plugins/** must retest on Dependabot PRs and again after merge to main.
  pull_request:
  push:
    branches: [main, crab-beta, crab-development]

permissions:
  contents: read

jobs:
  fixture-security:
    name: Fixture lock security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Resolve fixture security scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          head="${HEAD_SHA}"
          if [ -z "${base}" ] || [[ "${base}" =~ ^0+$ ]]; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${base}" "${head}"
          audit=false
          while IFS= read -r changed_path; do
            if [[ "${changed_path}" =~ ^plugins/[^/]+/package(-lock)?\.json$ ]] ||
              [ "${changed_path}" = "scripts/check-fixture-security.mjs" ] ||
              [ "${changed_path}" = "package.json" ]; then
              audit=true
            fi
          done < <(git diff --name-only "${base}" "${head}" --)
          echo "audit=${audit}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        if: ${{ steps.scope.outputs.audit == 'true' }}
        with:
          node-version: 22
      - name: Audit fixture locks
        if: ${{ steps.scope.outputs.audit == 'true' }}
        run: npm run check:fixture-security
      - name: Skip unchanged fixture locks
        if: ${{ steps.scope.outputs.audit != 'true' }}
        run: echo "No fixture lock or security-checker changes; scheduled audit owns drift detection."

  manifest:
    name: Default Track / Static checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugins/**/package-lock.json
      - name: Resolve pinned OpenClaw Default Track
        id: openclaw-track
        run: node scripts/openclaw-pin.mjs --github-output
      - uses: actions/checkout@v6
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.openclaw-track.outputs.ref }}
          path: openclaw
      - shell: bash
        timeout-minutes: 30
        run: |
          plugin_track="${{ steps.openclaw-track.outputs.track }}"
          extra_args=(--openclaw-track "${{ steps.openclaw-track.outputs.track }}" --plugin-track "${plugin_track}")
          if [ "${{ steps.openclaw-track.outputs.track }}" = "development" ]; then
            extra_args=(--openclaw-track "${{ steps.openclaw-track.outputs.track }}" --fixture-set openclaw-beta --plugin-track source-pack)
          fi
          node scripts/run-static-suite.mjs --openclaw ./openclaw --policy dashboard --profile-runs 3 --plugin-inspector-smoke "${extra_args[@]}"
      - name: Write CI summary artifacts
        if: always()
        continue-on-error: true
        env:
          CRABPOT_FIXTURE_SET: ${{ steps.openclaw-track.outputs.track == 'development' && 'openclaw-beta' || '' }}
          CRABPOT_OPENCLAW_TRACK: ${{ steps.openclaw-track.outputs.track }}
          CRABPOT_PLUGIN_TRACK: ${{ steps.openclaw-track.outputs.track == 'development' && 'source-pack' || steps.openclaw-track.outputs.track }}
        run: |
          node scripts/generate-report.mjs --openclaw ./openclaw
          node scripts/capture-contracts.mjs --openclaw ./openclaw
          node scripts/synthetic-probes.mjs --openclaw ./openclaw
          node scripts/cold-import-readiness.mjs --openclaw ./openclaw
          node scripts/workspace-plan.mjs --openclaw ./openclaw
          node scripts/platform-probes.mjs --openclaw ./openclaw
          node scripts/check-generated-surface-fixture.mjs --openclaw ./openclaw
          node scripts/import-loop-profile.mjs
          node scripts/profile-contract-runtime.mjs --openclaw ./openclaw --runs 3
          node scripts/compare-runtime-profile.mjs
          node scripts/check-ci-policy.mjs
          node scripts/write-ci-summary.mjs --mode check --openclaw-label "${{ steps.openclaw-track.outputs.label }}" --github-step-summary
      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crabpot-default-track-reports-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn

  container-smoke:
    name: Default Track / Container static checks
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Resolve pinned OpenClaw Default Track
        id: openclaw-track
        run: node scripts/openclaw-pin.mjs --github-output
      - uses: actions/checkout@v6
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.openclaw-track.outputs.ref }}
          path: openclaw
      - run: node --version
      - shell: bash
        timeout-minutes: 30
        run: |
          plugin_track="${{ steps.openclaw-track.outputs.track }}"
          extra_args=(--openclaw-track "${{ steps.openclaw-track.outputs.track }}" --plugin-track "${plugin_track}")
          if [ "${{ steps.openclaw-track.outputs.track }}" = "development" ]; then
            extra_args=(--openclaw-track "${{ steps.openclaw-track.outputs.track }}" --fixture-set openclaw-beta --plugin-track source-pack)
          fi
          node scripts/run-static-suite.mjs --openclaw ./openclaw --policy dashboard --profile-runs 3 --plugin-inspector-smoke "${extra_args[@]}"

  changed-fixture-plan:
    name: Default Track / Resolve changed fixture matrix
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      fixtures: ${{ steps.resolve.outputs.fixtures }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugins/**/package-lock.json
      - name: Resolve pinned OpenClaw Default Track
        id: openclaw-track
        run: node scripts/openclaw-pin.mjs --github-output
      - uses: actions/checkout@v6
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.openclaw-track.outputs.ref }}
          path: openclaw
      - name: Resolve diff refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          fi
          refs=()
          if [ -n "$base" ]; then refs+=("$base"); fi
          if [ -n "$head" ]; then refs+=("$head"); fi
          if [ "${#refs[@]}" -gt 0 ]; then
            git fetch --no-tags --depth=1 origin "${refs[@]}"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
      - name: Resolve changed fixture matrix
        id: resolve
        shell: bash
        run: |
          node scripts/resolve-fixture-set.mjs \
            --fixture-set changed-submodules \
            --base-ref "${{ steps.refs.outputs.base }}" \
            --head-ref "${{ steps.refs.outputs.head }}" \
            --openclaw ./openclaw \
            --allow-empty \
            --github-output >> "$GITHUB_OUTPUT"
      - name: Show selected fixtures
        run: echo "fixtures=${{ steps.resolve.outputs.fixtures }}"

  changed-isolated-fixture:
    name: Default Track / Isolated changed fixture ${{ matrix.id }}
    runs-on: ubuntu-latest
    needs: changed-fixture-plan
    if: ${{ needs.changed-fixture-plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changed-fixture-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugins/**/package-lock.json
      - name: Resolve pinned OpenClaw Default Track
        id: openclaw-track
        run: node scripts/openclaw-pin.mjs --github-output
      - uses: actions/checkout@v6
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.openclaw-track.outputs.ref }}
          path: openclaw
      - name: Materialize fixture payload
        env:
          CRABPOT_FIXTURE_SET: ${{ matrix.id }}
          CRABPOT_PLUGIN_TRACK: ${{ steps.openclaw-track.outputs.track == 'development' && 'source-pack' || steps.openclaw-track.outputs.track }}
        run: node scripts/sync-fixtures.mjs --materialize --openclaw ./openclaw
      - name: Validate workspace plan
        run: node scripts/workspace-plan.mjs --check --openclaw ./openclaw
      - name: Execute fixture lane
        id: execute
        continue-on-error: true
        env:
          CRABPOT_EXECUTE_ISOLATED: "1"
        run: npm run workspace:execute -- --fixture "${{ matrix.id }}" --allow-empty --openclaw ./openclaw
      - name: Summarize execution artifacts
        if: always()
        continue-on-error: true
        run: npm run execution:report
      - name: Reconcile compatibility report with runtime evidence
        if: always()
        continue-on-error: true
        run: node scripts/generate-report.mjs --openclaw ./openclaw --execution-results reports/crabpot-execution-results.json --fixture-set "${{ matrix.id }}"
      - name: Run execution policy
        id: policy
        if: always()
        continue-on-error: true
        run: node scripts/check-ci-policy.mjs
      - name: Write isolated summary
        if: always()
        continue-on-error: true
        run: node scripts/write-ci-summary.mjs --mode changed-isolated --openclaw-label "${{ steps.openclaw-track.outputs.label }}" --github-step-summary
      - name: Upload isolated execution artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crabpot-changed-isolated-${{ matrix.id }}
          path: |
            .crabpot/results/
            reports/crabpot-report.*
            reports/crabpot-issues.*
            reports/crabpot-execution-results.*
            reports/crabpot-ci-policy.*
            reports/crabpot-ci-summary.*
          if-no-files-found: warn
      - name: Fail if isolated policy failed
        if: ${{ steps.policy.outcome == 'failure' }}
        run: exit 1

  default-track:
    name: Default Track (pinned OpenClaw)
    runs-on: ubuntu-latest
    needs: [fixture-security, manifest, container-smoke, changed-fixture-plan, changed-isolated-fixture]
    if: always()
    steps:
      - name: Require every pinned lane
        env:
          FIXTURE_SECURITY_RESULT: ${{ needs.fixture-security.result }}
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
          PLAN_RESULT: ${{ needs.changed-fixture-plan.result }}
          ISOLATED_RESULT: ${{ needs.changed-isolated-fixture.result }}
        shell: bash
        run: |
          test "${FIXTURE_SECURITY_RESULT}" = success
          test "${MANIFEST_RESULT}" = success
          test "${CONTAINER_RESULT}" = success
          if [ "${PLAN_RESULT}" != success ] && [ "${PLAN_RESULT}" != skipped ]; then
            exit 1
          fi
          if [ "${ISOLATED_RESULT}" != success ] && [ "${ISOLATED_RESULT}" != skipped ]; then
            exit 1
          fi

  dashboard:
    runs-on: ubuntu-latest
    needs: [default-track]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.actor != 'github-actions[bot]' && needs.default-track.result == 'success' }}
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugins/**/package-lock.json
      - name: Resolve pinned OpenClaw Default Track
        id: openclaw-track
        run: node scripts/openclaw-pin.mjs --github-output
      - uses: actions/checkout@v6
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.openclaw-track.outputs.ref }}
          path: openclaw
      - run: node scripts/sync-fixtures.mjs --materialize --openclaw ./openclaw
        env:
          CRABPOT_FIXTURE_SET: ${{ steps.openclaw-track.outputs.track == 'development' && 'openclaw-beta' || '' }}
          CRABPOT_PLUGIN_TRACK: ${{ steps.openclaw-track.outputs.track == 'development' && 'source-pack' || steps.openclaw-track.outputs.track }}
      - name: Install OpenClaw lifecycle dependencies
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./openclaw/package.json').packageManager.split('+')[0]")" --activate
          pnpm --dir openclaw install --frozen-lockfile --ignore-scripts
      - name: Fetch main dashboard baseline
        if: ${{ steps.openclaw-track.outputs.track != 'latest' }}
        run: |
          mkdir -p .crabpot/baseline
          git fetch --no-tags --depth=1 origin main
          git show origin/main:reports/crabpot-dashboard-data.json > .crabpot/baseline/main-dashboard-data.json || true
      - name: Write README dashboard
        env:
          CRABPOT_FIXTURE_SET: ${{ steps.openclaw-track.outputs.track == 'development' && 'openclaw-beta' || '' }}
          CRABPOT_OPENCLAW_TRACK: ${{ steps.openclaw-track.outputs.track }}
          CRABPOT_PLUGIN_TRACK: ${{ steps.openclaw-track.outputs.track == 'development' && 'source-pack' || steps.openclaw-track.outputs.track }}
          CRABPOT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CRABPOT_SUMMARY_GENERATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          export CRABPOT_SUMMARY_GENERATED_AT
          run_profile_step() {
            local timeout_seconds="$1"
            local warning="$2"
            shift 2
            if timeout "${timeout_seconds}s" "$@"; then
              return 0
            fi
            echo "::warning::${warning}"
            return 1
          }
          run_openclaw_import_loop_profile() {
            local profile_json="reports/crabpot-import-loop-profile.json"
            local profile_markdown="reports/crabpot-import-loop-profile.md"
            rm -f "${profile_json}" "${profile_markdown}"
            if run_profile_step 180 "OpenClaw lifecycle import-loop profile failed or timed out; falling back to fixture-only import-loop profile" node scripts/import-loop-profile.mjs --openclaw ./openclaw --runs 3; then
              return 0
            fi
            rm -f "${profile_json}" "${profile_markdown}"
            if ! run_profile_step 90 "fixture-only import-loop profile failed or timed out; continuing without refreshed import-loop metrics" node scripts/import-loop-profile.mjs --runs 3; then
              rm -f "${profile_json}" "${profile_markdown}"
            fi
          }
          run_openclaw_runtime_profile() {
            local profile_json="reports/crabpot-runtime-profile.json"
            local profile_markdown="reports/crabpot-runtime-profile.md"
            runtime_profile_refreshed=0
            rm -f "${profile_json}" "${profile_markdown}"
            if run_profile_step 240 "OpenClaw runtime profile failed or timed out; falling back to fixture-only runtime profile" node scripts/profile-contract-runtime.mjs --openclaw ./openclaw --runs 3; then
              runtime_profile_refreshed=1
              return 0
            fi
            rm -f "${profile_json}" "${profile_markdown}"
            if run_profile_step 120 "fixture-only runtime profile failed or timed out; continuing without refreshed runtime metrics" node scripts/profile-contract-runtime.mjs --runs 3; then
              runtime_profile_refreshed=1
            else
              rm -f "${profile_json}" "${profile_markdown}"
            fi
          }
          node scripts/generate-report.mjs --openclaw ./openclaw
          node scripts/capture-contracts.mjs --openclaw ./openclaw
          node scripts/synthetic-probes.mjs --openclaw ./openclaw
          node scripts/cold-import-readiness.mjs --openclaw ./openclaw
          node scripts/workspace-plan.mjs --openclaw ./openclaw
          node scripts/platform-probes.mjs --openclaw ./openclaw
          run_openclaw_import_loop_profile
          run_openclaw_runtime_profile
          if [ "${runtime_profile_refreshed}" = 1 ]; then
            node scripts/compare-runtime-profile.mjs
          else
            echo "::warning::Runtime profile was not refreshed; skipping runtime profile diff"
          fi
          node scripts/check-ci-policy.mjs
          node scripts/write-ci-summary.mjs --mode check --openclaw-label "${{ steps.openclaw-track.outputs.label }}"
          node scripts/update-track-metadata.mjs --default-pin-openclaw ./openclaw
          baseline_arg=()
          if [ -f .crabpot/baseline/main-dashboard-data.json ]; then
            baseline_arg=(--baseline-data .crabpot/baseline/main-dashboard-data.json)
          fi
          node scripts/update-readme-summary.mjs "${baseline_arg[@]}"
          git add README.md reports/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(readme): update crabpot dashboard [skip ci]"
            dashboard_sha="$(git rev-parse HEAD)"
            staging_branch="dashboard-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            cleanup_staging() {
              git push origin --delete "${staging_branch}" >/dev/null 2>&1 || true
            }
            trap cleanup_staging EXIT
            git push origin "HEAD:refs/heads/${staging_branch}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${dashboard_sha}" \
              -f state=success \
              -f context="Default Track (pinned OpenClaw)" \
              -f description="Pinned Default Track passed before dashboard generation" \
              -f target_url="${CRABPOT_RUN_URL}"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || echo "::notice::Skipped stale dashboard push because ${GITHUB_REF_NAME} moved; a newer check run will refresh it."
          fi
