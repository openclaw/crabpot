name: Windows Lifecycle Cleanup Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-cleanup-725-diagnostic
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/diag/windows-cleanup-725'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source bytes
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'LF checkout configuration failed' }
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v7
        with:
          ref: 855a490b7cc33102c80dd927e7e2154ec47a364e
          path: candidate
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v7
        with:
          ref: 9336b829a29901db6617623feffa60f6b2123317
          path: baseline
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: 0a995f7bbcf791bde32f2fa75378fc1c7b45a995
          path: candidate/openclaw
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v7
        with:
          repository: openclaw/plugin-inspector
          ref: 8ebe4f8b2b8d327db77f5d3d4a02d4d327af4446
          path: inspector
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify identities and install frozen dependencies
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = @{ 'candidate' = '855a490b7cc33102c80dd927e7e2154ec47a364e'; 'baseline' = '9336b829a29901db6617623feffa60f6b2123317'; 'candidate/openclaw' = '0a995f7bbcf791bde32f2fa75378fc1c7b45a995'; 'inspector' = '8ebe4f8b2b8d327db77f5d3d4a02d4d327af4446' }
          foreach ($root in $pins.Keys) { if ((git -C $root rev-parse HEAD).Trim() -ne $pins[$root]) { throw 'Source identity mismatch' } }
          if ((node --version).Trim() -ne 'v24.22.1') { throw 'Node identity mismatch' }
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'Corepack enable failed' }
          $manager = (Get-Content candidate/openclaw/package.json -Raw | ConvertFrom-Json).packageManager.Split('+')[0]
          corepack prepare $manager --activate
          if ($LASTEXITCODE -ne 0) { throw 'Corepack prepare failed' }
          pnpm --dir candidate/openclaw install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Frozen host installation failed' }
          npm --prefix inspector ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Frozen Inspector installation failed' }
          New-Item -ItemType Directory -Force candidate/.crabpot/windows-cleanup-proof | Out-Null
          Copy-Item diagnostic/.crabpot/windows-cleanup-proof/qualify.mjs candidate/.crabpot/windows-cleanup-proof/
      - name: Prove old failure, focused behavior, and six real lifecycle samples
        timeout-minutes: 9
        run: |
          node candidate/.crabpot/windows-cleanup-proof/qualify.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Finite qualification failed; no automatic retry' }
      - name: Verify restored source
        if: always()
        run: |
          git -C candidate diff --exit-code -- scripts/run-openclaw-lifecycle-capture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source restoration failed' }
      - name: Upload bounded qualification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-cleanup-725-qualification
          path: candidate/.crabpot/windows-cleanup-proof/qualification.json
          if-no-files-found: warn
          retention-days: 3
