name: OpenClaw HEAD Canary (Advisory)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      remediation_regression:
        description: Run the finite frozen-input remediation comparison instead of the moving HEAD canary
        type: boolean
        default: false

# PR runs supersede each other; other event attempts remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resolve-head:
    if: ${{ !inputs.remediation_regression }}
    name: HEAD Canary / Resolve OpenClaw HEAD
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.openclaw-head.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: main
      - name: Record OpenClaw HEAD revision
        id: openclaw-head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  head-canary:
    name: HEAD Canary (advisory, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    needs: resolve-head
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            plugins/**/package-lock.json
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: ${{ needs.resolve-head.outputs.sha }}
          path: openclaw
      - name: Show OpenClaw HEAD revision
        shell: bash
        run: |
          sha="$(git -C openclaw rev-parse HEAD)"
          test "${sha}" = "${{ needs.resolve-head.outputs.sha }}"
          echo "OpenClaw HEAD: ${sha}"
      - name: Install OpenClaw lifecycle dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./openclaw/package.json').packageManager.split('+')[0]")" --activate
          pnpm --dir openclaw install --frozen-lockfile --ignore-scripts
      - name: Check npm latest metadata
        if: ${{ matrix.os == 'ubuntu-latest' }}
        continue-on-error: true
        run: node scripts/resolve-openclaw-track.mjs --track latest --warn-missing-tag
      - name: Run Default Track suite against HEAD
        id: suite
        shell: bash
        # Full-corpus profiling owns 27 individually bounded command samples.
        timeout-minutes: 360
        run: |
          node scripts/run-static-suite.mjs --write-reports \
            --openclaw ./openclaw \
            --policy dashboard \
            --profile-runs 3 \
            --plugin-inspector-smoke \
            --openclaw-track latest \
            --plugin-track latest
      - name: Measure OpenClaw lifecycle imports
        id: lifecycle
        if: ${{ !cancelled() && steps.suite.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          CRABPOT_OPENCLAW_TRACK: latest
          CRABPOT_PLUGIN_TRACK: latest
        shell: bash
        run: |
          node scripts/ci-report-handoff.mjs run lifecycle node scripts/import-loop-profile.mjs --openclaw ./openclaw --runs 3
      - name: Compare current runtime profile
        id: comparison
        if: ${{ !cancelled() && steps.suite.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          node scripts/ci-report-handoff.mjs run comparison node scripts/compare-runtime-profile.mjs
      - name: Write canary reports
        if: always()
        continue-on-error: true
        env:
          CRABPOT_CI_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: node scripts/write-ci-summary.mjs --run-report --mode head-canary --openclaw-label "openclaw/openclaw@${{ needs.resolve-head.outputs.sha }}" --github-step-summary
      - name: Upload HEAD canary reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crabpot-openclaw-head-canary-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn

  remediation-regression:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.remediation_regression }}
    name: Frozen remediation comparison (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: candidate
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: d7243fdb5fdfa118f8bbadfed50ed255075d1567
          path: base
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: 8c64e9fe961e426c21a7a014be21356355082c6b
          path: openclaw
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - id: old-node
        shell: bash
        run: echo "path=$(node -p 'process.execPath')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - id: fixed-node
        shell: bash
        run: echo "path=$(node -p 'process.execPath')" >> "$GITHUB_OUTPUT"
      - name: Run all four sequential source/runtime comparisons
        shell: bash
        env:
          OLD_NODE: ${{ steps.old-node.outputs.path }}
          FIXED_NODE: ${{ steps.fixed-node.outputs.path }}
        run: |
          python candidate/.github/remediation-regression.py \
            --base "$GITHUB_WORKSPACE/base" --candidate "$GITHUB_WORKSPACE/candidate" \
            --openclaw "$GITHUB_WORKSPACE/openclaw" \
            --old-node "$OLD_NODE" --fixed-node "$FIXED_NODE" \
            --output "$GITHUB_WORKSPACE/regression-evidence"
      - name: Retain exact inputs and comparison failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frozen-remediation-${{ matrix.os }}
          path: |
            regression-evidence/identities.json
            regression-evidence/fixture-files.json
            regression-evidence/results.json
            regression-evidence/*/result.json
            regression-evidence/*/tests.log
            tls-evidence/*.json
            tls-evidence/*.log
            tls-evidence/*.sha256
          if-no-files-found: error

  remediation-node22-tls:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.remediation_regression }}
    name: Finite affected Node22 Linux x64 TLS proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - id: old-node
        shell: bash
        run: echo "path=$(node -p 'process.execPath')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Qualify the actual affected Node22 executable
        shell: bash
        env:
          OLD_NODE: ${{ steps.old-node.outputs.path }}
        run: |
          python3 .github/remediation-tls.py \
            --old-node "$OLD_NODE" --fixed-node "$(node -p 'process.execPath')" \
            --expected-fixed-version v22.23.4 \
            --authenticated-manifest-sha256 c90c3f1478fda8308b22cc1a1b0dc536169196444e67ee8b5c582fd351d02bce \
            --output "$GITHUB_WORKSPACE/tls-evidence"
      - name: Retain actual Node22 inputs and TLS results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: affected-node22-linux-x64-tls
          path: |
            tls-evidence/*.json
            tls-evidence/*.log
            tls-evidence/SHASUMS256.txt
          if-no-files-found: error

  remediation-bookworm-tls:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.remediation_regression }}
    name: Finite affected bookworm image TLS proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same immutable image selected by the completed default-track container job.
    container:
      image: node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - id: old-node
        shell: bash
        run: echo "path=$(node -p 'process.execPath')" >> "$GITHUB_OUTPUT"
      - name: Qualify the image's actual executable and trust stores
        shell: bash
        env:
          OLD_NODE: ${{ steps.old-node.outputs.path }}
        run: |
          python3 .github/remediation-tls.py \
            --old-node "$OLD_NODE" --fixed-node /usr/local/bin/node \
            --expected-fixed-version v24.22.1 \
            --authenticated-manifest-sha256 fdfbffc969c0f604beff0124d409b33a43b53f5c681d6220f80023e0d6df9dc4 \
            --container-image node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a \
            --output "$GITHUB_WORKSPACE/tls-evidence"
      - name: Retain actual image inputs and TLS results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: affected-bookworm-linux-x64-tls
          path: |
            tls-evidence/*.json
            tls-evidence/*.log
            tls-evidence/SHASUMS256.txt
          if-no-files-found: error
