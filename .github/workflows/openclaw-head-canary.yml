name: PR405 Windows helper diagnostic
run-name: PR405 helper entry / ${{ github.sha }}

# Diagnostic ref only. The main and PR405 workflow definitions stay unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr405-helper-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  helper:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diag/pr405-helper-entry-20261002' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Verify exact diagnostic base
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 7a23175f425c77f5a82ca997484a4e7004f8d28c
      - name: Observe the first native helper
        shell: bash
        timeout-minutes: 3
        run: node scripts/diagnose-pr405-helper.mjs
      - name: Retain bounded diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr405-helper-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr405-helper.json
          if-no-files-found: warn
          retention-days: 3
