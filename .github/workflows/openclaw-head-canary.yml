name: Windows Lifecycle Cleanup Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-cleanup-725-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/diag/windows-cleanup-725'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Bound preparation
        run: |
          "DIAGNOSTIC_SETUP_DEADLINE=$([DateTime]::UtcNow.AddMinutes(20).ToString("o"))" >> $env:GITHUB_ENV
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'LF checkout configuration failed' }
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v7
        with:
          ref: 9336b829a29901db6617623feffa60f6b2123317
          path: candidate
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: 0a995f7bbcf791bde32f2fa75378fc1c7b45a995
          path: candidate/openclaw
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify frozen inputs and install host dependencies
        timeout-minutes: 18
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C candidate rev-parse HEAD).Trim() -ne '9336b829a29901db6617623feffa60f6b2123317') { throw 'Crabpot identity mismatch' }
          if ((git -C candidate/openclaw rev-parse HEAD).Trim() -ne '0a995f7bbcf791bde32f2fa75378fc1c7b45a995') { throw 'OpenClaw identity mismatch' }
          if ((node --version).Trim() -ne 'v24.22.1') { throw 'Node identity mismatch' }
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'Corepack enable failed' }
          $manager = (Get-Content candidate/openclaw/package.json -Raw | ConvertFrom-Json).packageManager.Split('+')[0]
          corepack prepare $manager --activate
          if ($LASTEXITCODE -ne 0) { throw 'Corepack prepare failed' }
          pnpm --dir candidate/openclaw install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Frozen host installation failed' }
          if ([DateTime]::UtcNow -gt [DateTime]::Parse($env:DIAGNOSTIC_SETUP_DEADLINE)) { throw 'Preparation exceeded 20 minutes' }
          New-Item -ItemType Directory -Force candidate/.crabpot/windows-cleanup-proof | Out-Null
          Copy-Item diagnostic/.crabpot/windows-cleanup-proof/inputs.json candidate/.crabpot/windows-cleanup-proof/
          Copy-Item diagnostic/.crabpot/windows-cleanup-proof/observer.mjs candidate/.crabpot/windows-cleanup-proof/
          Copy-Item diagnostic/.crabpot/windows-cleanup-proof/diagnostic.mjs candidate/.crabpot/windows-cleanup-proof/
          Copy-Item diagnostic/.crabpot/windows-cleanup-proof/receipt-scrub.mjs candidate/.crabpot/windows-cleanup-proof/
      - name: Original capture once
        id: original
        timeout-minutes: 2
        run: |
          node candidate/.crabpot/windows-cleanup-proof/diagnostic.mjs original candidate/openclaw
          if ($LASTEXITCODE -ne 0) { throw 'Original observation did not admit instrumentation; stop' }
      - name: Instrumented capture once after matching cleanup failure
        if: ${{ success() && steps.original.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          node candidate/.crabpot/windows-cleanup-proof/diagnostic.mjs instrumented candidate/openclaw
          if ($LASTEXITCODE -ne 0) { throw 'Instrumented evidence is incomplete; no further run' }
      - name: Verify source restoration
        if: always()
        run: |
          git -C candidate diff --exit-code -- scripts/run-openclaw-lifecycle-capture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Crabpot source restoration failed' }
          git -C candidate/openclaw diff --exit-code -- src/infra/sqlite-staging-token.ts
          if ($LASTEXITCODE -ne 0) { throw 'OpenClaw source restoration failed' }
          $files = @(Get-ChildItem candidate/.crabpot/windows-cleanup-proof/*-receipt.json -ErrorAction SilentlyContinue)
          if (($files | Measure-Object Length -Sum).Sum -gt 2MB) { throw 'Diagnostic output exceeds 2 MiB' }
      - name: Upload bounded sanitized receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-cleanup-725-diagnostic
          path: |
            candidate/.crabpot/windows-cleanup-proof/inputs.json
            candidate/.crabpot/windows-cleanup-proof/*-receipt.json
          if-no-files-found: warn
          retention-days: 3
